[project]
name = "manikin"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "numpy>=2.5",
    "pillow>=13.0",
    "python-multipart>=0.0.32",
    "sam-3d-body",
    "segno~=1.6",
    "setproctitle~=1.3",
    "starlette>=1.7",
    "torch>=2.15",
    "uvicorn>=0.51",
]

[project.optional-dependencies]
dev = [
    "black",
    "httpx",
    "isort",
    "mypy",
    "pyright",
    "pytest",
]

[project.scripts]
manikin = "manikin.__main__:main"

[build-system]
requires = ["setuptools >= 61.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["manikin"]

[tool.setuptools.package-data]
"manikin" = ["py.typed", "static/**/*", "blender/*.py"]

[tool.isort]
profile = "black"
skip = [".direnv", "result", ".venv"]

[tool.black]
target-version = ["py313"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
# Blender-side scripts import bpy, which has no type stubs in nixpkgs.
exclude = [
    ".direnv",
    "result",
    ".venv",
    "manikin/blender",
    "tests/blender_driver.py",
]

[tool.mypy]
python_version = "3.13"
strict = true
# Blender-side scripts import bpy, which has no type stubs in nixpkgs.
exclude = [
    "^\\.direnv/",
    "^result/",
    "^\\.venv/",
    "^manikin/blender/",
    "^tests/blender_driver\\.py$",
]

# Improved error messages
pretty = true
show_column_numbers = true
show_error_context = true

[tool.pytest.ini_options]
markers = [
    "integration: black-box integration tests that require installed executables",
    "gpu: manual tests that run the pose backend on the GPU with downloaded weights",
    "blender: manual tests that run headless Blender (see `just test-blender`)",
]
addopts = "-m 'not gpu and not blender'"

# sam-3d-body ships no type information.
[[tool.mypy.overrides]]
module = ["sam_3d_body", "sam_3d_body.*"]
ignore_missing_imports = true
