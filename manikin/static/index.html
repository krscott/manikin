<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>manikin</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script type="importmap">
      { "imports": { "three": "/static/vendor/three/three.module.min.js" } }
    </script>
  </head>
  <body>
    <header><h1>manikin</h1></header>

    <main>
      <section id="capture">
        <p class="lead">Photograph one person, head to toe.</p>
        <label class="button primary">
          Take photo
          <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
        </label>
        <label class="button">
          Choose photo
          <input id="file-input" type="file" accept="image/*" hidden />
        </label>
        <p id="model-note" class="note"></p>
      </section>

      <section id="processing" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p id="processing-text">Estimating pose…</p>
      </section>

      <section id="preview" hidden>
        <div class="tabs" role="tablist">
          <button id="tab-photo" role="tab" aria-selected="true">Photo</button>
          <button id="tab-3d" role="tab" aria-selected="false">3D</button>
        </div>
        <div id="view-photo" class="view"><canvas id="overlay"></canvas></div>
        <div id="view-3d" class="view" hidden></div>
        <p class="note legend">
          <span class="left">Blue</span>: subject's left ·
          <span class="right">Orange</span>: subject's right
        </p>
        <ul id="warnings"></ul>
        <label class="field">
          Name (optional)
          <input id="pose-name" type="text" autocomplete="off" placeholder="e.g. sword stance" />
        </label>
        <div class="actions">
          <button id="retake" class="button">Retake</button>
          <button id="accept" class="button primary">Accept</button>
        </div>
        <p id="accept-error" class="error" role="alert"></p>
      </section>

      <section id="saved" hidden>
        <p>Saved <strong id="saved-name"></strong></p>
        <button id="again" class="button primary">Take another</button>
      </section>

      <section id="failed" hidden>
        <p id="error-text" class="error"></p>
        <button id="try-again" class="button primary">Try again</button>
      </section>
    </main>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
